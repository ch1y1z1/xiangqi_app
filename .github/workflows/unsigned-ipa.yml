name: Unsigned iOS IPA

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ipa:
    name: Build unsigned device IPA
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Check out app and pinned Pikafish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Show build environment
        run: |
          xcodebuild -version
          python3 --version
          command -v 7z

      - name: Cache offline NNUE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Resources/pikafish.nnue
          key: pikafish-nnue-7d13d73569a9b571ba0eb20cf1596247bc2a42738967e61afef6482b231e900e

      - name: Archive and package unsigned IPA
        shell: bash
        run: |
          mkdir -p build
          zsh scripts/package-ipa.sh "$BUILD_CONFIGURATION" 2>&1 | tee build/ci-build.log

      - name: Verify package and preserve debug symbols
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile
          from pathlib import Path

          ipa = next(Path('build/ipa').glob('*.ipa'))
          with zipfile.ZipFile(ipa) as package:
              assert package.testzip() is None, 'Corrupt IPA'
              info = plistlib.loads(package.read('Payload/Xiangqi.app/Info.plist'))
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'], 'Not a device build'
              assert 'Payload/Xiangqi.app/pikafish.nnue' in package.namelist(), 'Missing offline model'
              assert not any(name.endswith('embedded.mobileprovision') for name in package.namelist()), 'Unexpected provisioning profile'
          print(f'Verified unsigned device package: {ipa.name}')
          PY
          (
            cd build/ipa
            shasum -a 256 ./*.ipa > SHA256SUMS.txt
          )
          ditto -c -k --keepParent --norsrc --noextattr \
            "build/Archives/Xiangqi-${BUILD_CONFIGURATION}-unsigned.xcarchive/dSYMs/Xiangqi.app.dSYM" \
            "build/ipa/Xiangqi-${BUILD_CONFIGURATION}-dSYM.zip"

      - name: Upload unsigned IPA and checksum
        id: ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-ipa-${{ env.BUILD_CONFIGURATION }}
          path: |
            build/ipa/*.ipa
            build/ipa/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload matching debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ env.BUILD_CONFIGURATION }}
          path: build/ipa/*-dSYM.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add download link to run summary
        env:
          IPA_ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          printf '### 未签名 iOS IPA\n\n配置：%s · arm64 · iOS 17+ · 包含离线模型\n\n[下载 IPA 与 SHA-256 校验文件](%s)\n\n安装前需使用自己的证书与描述文件重新签名。产物保留 14 天。\n' \
            "$BUILD_CONFIGURATION" "$IPA_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-build-log
          path: build/ci-build.log
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: ipa
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified IPA and debug symbols
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-Release'
          merge-multiple: true
          path: build/release-assets

      - name: Verify downloaded IPA checksum
        working-directory: build/release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish this push as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          release_options=(--latest=false)
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            main_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
            if [ "$main_head" = "$GITHUB_SHA" ]; then
              release_options=(--latest=true)
            fi
          else
            release_options+=(--prerelease)
          fi

          cat > build/release-notes.md <<EOF
          本次 push 自动构建的未签名 iOS IPA，包含离线 Pikafish NNUE。

          - 分支：\`${GITHUB_REF_NAME}\`
          - 源码：[\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - 构建：[GitHub Actions #${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - 配置：Release · arm64 · iOS 17+

          附件：未签名 IPA、SHA256SUMS.txt 和对应 dSYM。安装前需使用自己的证书与描述文件重新签名。
          EOF

          gh release create "$release_tag" \
            build/release-assets/*.ipa \
            build/release-assets/SHA256SUMS.txt \
            build/release-assets/*-dSYM.zip \
            --target "$GITHUB_SHA" \
            --title "象棋残局 · Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})" \
            --notes-file build/release-notes.md \
            "${release_options[@]}"

          printf '### GitHub Release\n\n[下载本次 push 的 IPA、校验文件与调试符号](https://github.com/%s/releases/tag/%s)\n\nRelease 附件不受 Actions artifact 的 14 天保留期限制。\n' \
            "$GITHUB_REPOSITORY" "$release_tag" >> "$GITHUB_STEP_SUMMARY"
